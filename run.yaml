apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: tax-calculator-run-
spec:
  pipelineRef:
    name: tax-calculator-pipeline
  workspaces:
    - name: pipeline-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
  params:
    - name: repo-url
      # Replace this with your actual GitHub repository URL
      value: "https://github.com/your-username/tax-calculator.git"
    - name: image-reference
      # Replace this with your IBM Cloud Container Registry path
      value: "us.icr.io/your-namespace/tax-calculator:latest"
